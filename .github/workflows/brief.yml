name: Market Morning Brief
on:
  schedule:
    - cron: '50 21 * * 0-4'   # 06:50 KST 월~금 (주)
    - cron: '35 22 * * 0-4'   # 07:35 KST 월~금 (백업, 멱등)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brief
  cancel-in-progress: false
env:
  TZ: Asia/Seoul
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.lock }
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      - name: Run brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_KIND: ${{ github.event.schedule == '35 22 * * 0-4' && 'backup' || (github.event_name == 'workflow_dispatch' && 'manual' || 'primary') }}
        run: python -m brief.run --run-kind "$RUN_KIND" ${{ github.event_name == 'schedule' && '--skip-if-done' || '' }}
      - name: Fallback if runner killed
        if: always()
        run: '[ -f "docs/status/$(TZ=Asia/Seoul date +%F).json" ] || python -m brief.fallback --reason runner_killed'
      - name: Publish
        if: always()
        env:
          RUN_KIND: ${{ github.event.schedule == '35 22 * * 0-4' && 'backup' || (github.event_name == 'workflow_dispatch' && 'manual' || 'primary') }}
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "brief: $(TZ=Asia/Seoul date +%F) [$RUN_KIND]"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
