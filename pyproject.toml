[project]
name = "market-morning-brief"
version = "0.1.0"
description = "리서치 대시보드 — 미국·유럽·한국·중국 시장 데이터 + Claude Code CLI 보고서 6종 (로컬 대시보드, GitHub Pages 게시)"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0.11,<7",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.9,<3",
  "python-dateutil>=2.9,<3",
  "pyyaml>=6.0,<7",
  "beautifulsoup4>=4.12,<5",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "freezegun>=1.5"]

[tool.setuptools.packages.find]
include = ["brief*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
brief = ["render/templates/*.html", "sources.yaml"]
