# 소스 정의 — PLAN.md §3(v2.1) + §11.3(v4). type은 rss / google_news / naver_news 만 허용(페이지 크롤링 없음).
# tz: pubDate에 시간대가 없을 때 가정할 시간대. category: US / KR / MACRO / EU / CN / GLOBAL.
# required: 매 실행 반드시 시도·누락 시 배너 명시. 2026-09-17 프로브: ECB·BoE OK, BLS·IMF 403, 미 재무부 타임아웃(제외).
defaults:
  timeout_s: 15
  retries: 2
  user_agent: "MarketMorningBrief/0.1 (+https://github.com/holymolygwakamoly/market-morning-brief; RSS reader; contact via repo issues)"
  naver_min_interval_s: 0.5   # 네이버 API HUB 요청 간격(전체 공유)
  naver_max_pages: 4          # 검색어당 최대 페이지(100건/쪽, 최신순) — 수집 윈도 안 기사가 나올 때까지
  # 네이버 결과엔 매체명이 없어 링크 도메인으로 붙임(없으면 도메인 그대로)
