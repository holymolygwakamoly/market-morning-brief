<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리서치 대시보드</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1c1f24;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--up:#d92d20;--down:#1d4ed8;--warn:#b45309;--warn-bg:#fef3c7;--err:#b91c1c;--err-bg:#fee2e2;--ok:#047857;--ok-bg:#d1fae5;--nav:#111827;--nav-ink:#d1d5db}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--nav);color:var(--nav-ink);padding:18px 0;position:sticky;top:0;height:100vh;overflow:auto}
nav .brand{padding:0 18px 14px;font-weight:700;color:#fff;font-size:16px;letter-spacing:.2px}
nav .brand small{display:block;font-weight:400;color:#9ca3af;font-size:11px}
nav a.tab{display:flex;justify-content:space-between;align-items:center;padding:9px 18px;color:var(--nav-ink);border-left:3px solid transparent}
nav a.tab:hover{background:#1f2937;text-decoration:none}
nav a.tab.active{background:#1f2937;color:#fff;border-left-color:var(--accent)}
.badge{font-size:10px;padding:1px 6px;border-radius:999px;background:#374151;color:#e5e7eb}
.badge.ok{background:#065f46}.badge.fail{background:#991b1b}.badge.run{background:#92400e}.badge.none{background:#374151}
main{padding:0 24px 40px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.topbar input[type=date]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
.topbar .status{color:var(--muted);font-size:13px}
.topbar .spacer{flex:1}
.banner{margin:14px 0 0;padding:10px 14px;border-radius:8px;font-size:13px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.err{background:var(--err-bg);color:var(--err)}.banner.ok{background:var(--ok-bg);color:var(--ok)}.banner.info{background:#e0e7ff;color:#3730a3}
.progress{margin:12px 0;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.progress .stage{font-weight:600}
.progress pre{margin:8px 0 0;max-height:180px;overflow:auto;font-size:11px;color:var(--muted);background:#f9fafb;padding:8px;border-radius:6px}
h1{font-size:20px;margin:22px 0 10px}h2{font-size:16px;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}h3{font-size:14px;margin:18px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;position:relative}
.card.clickable{cursor:pointer}.card.clickable:hover{border-color:var(--accent);box-shadow:0 1px 6px rgba(37,99,235,.15)}
.card .name{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.card .close{font-size:18px;font-weight:700;margin-top:2px}
.card .chg{font-size:13px;font-weight:600}
.card .asof{font-size:10px;color:var(--muted)}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.spark{position:absolute;right:10px;bottom:10px;width:64px;height:26px}
.headlines{list-style:none;margin:0;padding:0}
.headlines li{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:baseline}
.headlines .imp{font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:4px;padding:0 6px;flex:none}
.headlines .topic{font-size:11px;color:var(--muted);flex:none}
.subtabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.subtabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:#f9fafb;font-weight:600;color:var(--muted);position:sticky;top:0}
td.l,th.l{text-align:left}
tr:hover td{background:#f3f4f6}
.report{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 22px;max-width:980px}
.report .overview{font-size:15px;background:#f9fafb;border-left:4px solid var(--accent);padding:12px 14px;border-radius:6px}
.report section{margin-top:22px}
.report p{margin:0 0 10px;white-space:pre-wrap}
.report ul{margin:6px 0 0 18px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:#eef2ff;color:#3730a3;border-radius:999px;padding:2px 10px}
.sector{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:10px}
.sector .dir{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff;margin-right:6px}
.dir.up{background:var(--up)}.dir.down{background:var(--down)}.dir.issue{background:#6b7280}
.leaders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:8px}
.leader{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.leader b{display:block}
.articles li{font-size:13px;margin-bottom:4px}
.articles .src{color:var(--muted);font-size:12px}
.small{font-size:12px;color:var(--muted)}
.mono{font-family:ui-monospace,Consolas,monospace}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:10px}
.datelist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.datelist a{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:#fff}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  nav{position:static;height:auto;display:flex;overflow-x:auto;padding:8px 6px;gap:2px}
  nav .brand{display:none}
  nav a.tab{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:6px 10px}
  nav a.tab.active{border-bottom-color:var(--accent)}
  main{padding:0 14px 30px}
}
</style>
</head>
<body>
<div class="layout">
  <nav id="nav">
    <div class="brand">리서치 대시보드<small>Market Research Dashboard</small></div>
  </nav>
  <main>
    <div class="topbar">
      <label>기준일 <input type="date" id="date"></label>
      <button class="primary" id="btnUpdate" disabled>업데이트</button>
      <button id="btnRegen" hidden>이 탭 재생성</button>
      <span class="status" id="topStatus"></span>
      <span class="spacer"></span>
      <button id="btnPublish" hidden>GitHub에 게시</button>
    </div>
    <div id="banners"></div>
    <div id="progress" hidden class="progress"><div class="stage"></div><pre></pre></div>
    <div id="view"></div>
  </main>
</div>
<script>
(() => {
"use strict";
const TOPICS = [["macro","거시경제"],["sectors","섹터별 주요뉴스"],["us","미국시장"],["eu","유럽시장"],["kr","한국시장"],["cn","중국시장"]];
const GROUP_ORDER = ["미국","유럽","한국","중국·아시아","환율","금리","원자재","섹터ETF"];
const S = {date:null, today:null, view:"home", key:null, index:null, home:null, reports:{}, tables:{}, local:false, job:null, dates:[], canPublish:false};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kstToday = () => new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const fmtNum = (v, d=2) => v==null ? "-" : Math.abs(v) >= 1e12 ? (v/1e12).toFixed(2)+"조" : Math.abs(v) >= 1e8 ? (v/1e8).toFixed(0)+"억" : Math.abs(v) >= 1e4 ? Math.round(v).toLocaleString() : Number(v).toFixed(d);
const fmtPx = v => v==null ? "-" : Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : Math.abs(v) >= 10 ? Number(v).toFixed(2) : Number(v).toFixed(4).replace(/0+$/,"").replace(/\.$/,"");
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "flat";
const pct = v => v==null ? "-" : (v>0?"+":"")+Number(v).toFixed(2)+"%";
async function getJSON(path, opts){ const r = await fetch(path + (path.includes("?")?"&":"?") + "_=" + Date.now(), opts); if(!r.ok) throw new Error(r.status+" "+path); return r.json(); }

// ---- 라우팅: #d=YYYY-MM-DD&v=home|index|report&k=key
function readHash(){ const p = new URLSearchParams(location.hash.replace(/^#/,"")); return {d:p.get("d"), v:p.get("v")||"home", k:p.get("k")}; }
function go(v, k){ const p = new URLSearchParams(); p.set("d", S.date); p.set("v", v); if(k) p.set("k", k); location.hash = p.toString(); }
window.addEventListener("hashchange", () => { const h = readHash(); if(h.d && h.d !== S.date){ S.date = h.d; $("#date").value = h.d; loadDate().then(render); } else { S.view = h.v; S.key = h.k; render(); } });

// ---- 데이터 로드
async function loadIndex(){ try { S.dates = (await getJSON("data/index.json")).dates || []; } catch { S.dates = []; } }
async function loadDate(){
  S.home = null; S.reports = {}; S.tables = {};
  try { S.home = await getJSON(`data/${S.date}/home.json`); } catch { S.home = null; }
  const h = readHash(); S.view = h.v; S.key = h.k;
}
async function loadReport(t){ if(S.reports[t]) return S.reports[t]; try { S.reports[t] = await getJSON(`data/${S.date}/reports/${t}.json`); } catch { S.reports[t] = null; } return S.reports[t]; }
async function loadTable(k){ if(S.tables[k]) return S.tables[k]; try { S.tables[k] = await getJSON(`data/${S.date}/indices/${k}.json`); } catch { S.tables[k] = null; } return S.tables[k]; }

// ---- 로컬 API
async function pollStatus(){
  try { const st = await getJSON("/api/status"); S.local = true; S.job = st; S.canPublish = !!st.can_publish; if(st.today) S.today = st.today; }
  catch { S.local = false; S.job = null; }
  renderTop();
  if(S.job && S.job.running) { renderProgress(); setTimeout(pollStatus, 2000); }
  else if(S._wasRunning){ S._wasRunning = false; $("#progress").hidden = true; await loadIndex(); await loadDate(); render(); }
  if(S.job && S.job.running) S._wasRunning = true;
}
async function post(path, body){ const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{})}); const j = await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error || r.status); return j; }

// ---- 상단 바
function renderTop(){
  const today = S.today || kstToday();
  const isToday = S.date === today;
  const done = S.home && ["success","degraded"].includes(S.home.result);
  const running = S.job && S.job.running;
  const b = $("#btnUpdate");
  b.disabled = !(S.local && isToday && !running && !done);
  b.title = !S.local ? "로컬 대시보드 서버에서만 업데이트할 수 있습니다" : !isToday ? "업데이트는 오늘(KST) 기준일만 가능합니다" : done ? "오늘 업데이트는 이미 완료되었습니다(하루 1회). 탭별 재생성만 가능합니다" : running ? "실행 중" : "오늘 데이터를 생성합니다 (12~20분)";
  const rg = $("#btnRegen"); rg.hidden = !(S.local && isToday && S.view === "report" && S.home); rg.disabled = !!running;
  $("#btnPublish").hidden = !(S.local && S.canPublish);
  let s = "";
  if(running) s = `실행 중 · ${S.job.stage || ""} · ${Math.round(S.job.elapsed_s||0)}s`;
  else if(S.home) s = `마지막 업데이트 ${String(S.home.updated_at_kst||"").slice(0,16).replace("T"," ")} · ${S.home.result}`;
  else s = isToday ? "오늘 데이터 없음" : "저장된 데이터 없음";
  $("#topStatus").textContent = s;
  $("#date").max = today;
}
function renderProgress(){
  const p = $("#progress"); p.hidden = false;
  $(".stage", p).textContent = `${S.job.kind || "업데이트"} ${S.job.date} — 단계: ${S.job.stage || "start"} (${Math.round(S.job.elapsed_s||0)}s)`;
  $("pre", p).textContent = (S.job.log||[]).slice(-12).join("\n");
}
function banners(){
  const out = [];
  if(!S.home){ out.push(["info", S.date === (S.today||kstToday()) ? "오늘 기준일 데이터가 아직 없습니다. [업데이트]를 눌러 생성하세요." : `${S.date} 업데이트 내역이 없습니다. 지난 기준일은 그날 업데이트한 경우에만 볼 수 있습니다.`]); return out; }
  if(S.home.result === "failed") out.push(["err", "업데이트 실패: " + esc(S.home.error || (S.job&&S.job.error) || "")]);
  const failed = (S.home.sources||{}).failed || [];
  if(failed.length) out.push(["warn", "누락 소스: " + esc(failed.join(", "))]);
  const bad = Object.entries(S.home.topics||{}).filter(([,v]) => !v.ok);
  if(bad.length) out.push(["warn", "생성 실패한 보고서: " + bad.map(([t,v]) => `${esc(v.name)} (${esc((v.error||"").slice(0,80))})`).join(" · ") + (S.local ? " — 해당 탭에서 [이 탭 재생성]" : "")]);
  if((S.home.market_errors||[]).length) out.push(["warn", "시장 데이터 경고: " + esc(S.home.market_errors.slice(0,4).join(" · "))]);
  return out;
}

// ---- 좌측 탭
function renderNav(){
  const nav = $("#nav"); nav.querySelectorAll("a.tab").forEach(a => a.remove());
  const mk = (label, v, k, badge) => { const a = document.createElement("a"); a.className = "tab" + ((S.view===v && (S.view!=="report" || S.key===k)) ? " active" : ""); a.href = "#"; a.innerHTML = `<span>${esc(label)}</span>${badge?`<span class="badge ${badge[0]}">${badge[1]}</span>`:""}`; a.onclick = e => { e.preventDefault(); go(v, k); }; nav.appendChild(a); };
  mk("홈", "home", null, S.home ? ["ok", S.date] : ["none","-"]);
  for(const [t, name] of TOPICS){ const st = S.home && S.home.topics && S.home.topics[t]; const running = S.job && S.job.running && (S.job.topics||[]).includes(t); mk(name, "report", t, running ? ["run","생성 중"] : !S.home ? ["none","없음"] : st && st.ok ? ["ok","완료"] : ["fail","실패"]); }
}

// ---- 홈
function sparkline(hist){
  if(!hist || hist.length < 2) return "";
  const xs = hist.map(b => b.close), min = Math.min(...xs), max = Math.max(...xs), w = 64, h = 26;
  const pts = xs.map((v,i) => `${(i/(xs.length-1))*w},${h - (max===min ? h/2 : (v-min)/(max-min)*(h-4)+2)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${xs[xs.length-1] >= xs[0] ? "#d92d20" : "#1d4ed8"}" stroke-width="1.5"/></svg>`;
}
function renderHome(){
  const h = S.home; if(!h) return `<div class="empty">표시할 데이터가 없습니다.</div>`;
  const groups = {}; for(const q of h.indices||[]) (groups[q.group||q.region] ||= []).push(q);
  let html = `<h1>홈 — ${esc(h.date)} 기준</h1>`;
  if((h.headlines||[]).length){ html += `<h2>오늘의 핵심 5</h2><ul class="headlines">` + h.headlines.map(x => `<li><span class="imp">${x.importance}</span><span>${esc(x.text)}</span><a href="#" class="topic" data-topic="${esc(x.topic)}">${esc(x.topic_name)} →</a></li>`).join("") + `</ul>`; }
  for(const g of GROUP_ORDER.concat(Object.keys(groups).filter(k => !GROUP_ORDER.includes(k)))){
    const qs = groups[g]; if(!qs) continue;
    html += `<h2>${esc(g)}</h2><div class="grid">` + qs.map(q => {
      const click = q.constituents_key ? ` clickable" data-key="${esc(q.constituents_key)}"` : `" data-sym="${esc(q.symbol)}"`;
      const unit = q.kind === "rate" ? "%" : "";
      return `<div class="card${click}><div class="name"><span>${esc(q.name)}</span><span class="mono">${esc(q.symbol)}</span></div><div class="close">${fmtPx(q.close)}${unit}</div><div class="chg ${cls(q.change_pct)}">${pct(q.change_pct)} ${q.change_abs!=null?`(${q.change_abs>0?"+":""}${fmtPx(q.change_abs)})`:""}</div><div class="asof">${esc(q.session_date)} 세션${q.constituents_key?" · 구성종목 ▸":""}</div>${sparkline(q.history)}</div>`;
    }).join("") + `</div>`;
  }
  const src = h.sources || {};
  html += `<h2>보고서·소스 상태</h2><div class="chips">` + Object.entries(h.topics||{}).map(([t,v]) => `<span class="chip" style="${v.ok?"":"background:#fee2e2;color:#991b1b"}">${esc(v.name)}: ${v.ok?"완료":"실패"}</span>`).join("") + `<span class="chip">뉴스 소스 ${src.ok||0}/${src.total||0}</span>` + Object.entries(h.constituents||{}).map(([k,v]) => `<span class="chip">${esc(v.index_name)} ${v.rows}/${v.total}</span>`).join("") + `</div>`;
  if(S.dates.length){ html += `<h2>저장된 기준일</h2><div class="datelist">` + S.dates.map(d => `<a href="#" data-date="${d.date}">${d.date} <span class="small">${d.result||""}</span></a>`).join("") + `</div>`; }
  return html;
}

// ---- 지수 상세
const SORTS = [["change_pct","등락폭"],["value","거래대금"],["market_cap","시가총액"]];
function renderIndex(){
  const t = S.tables[S.key];
  if(t === undefined) { loadTable(S.key).then(render); return `<div class="empty">불러오는 중…</div>`; }
  if(!t) return `<div class="empty">구성종목 데이터가 없습니다.</div>`;
  const sort = S.sort || "change_pct";
  const rows = (t.rows||[]).filter(r => r[sort] != null).sort((a,b) => (b[sort]||0) - (a[sort]||0));
  const up = t.rows.filter(r => r.change_pct > 0).length, down = t.rows.filter(r => r.change_pct < 0).length;
  const byChg = [...t.rows].sort((a,b)=>b.change_pct-a.change_pct);
  const cur = t.currency === "KRW" ? "원" : "$";
  let html = `<h1>${esc(t.index_name)} 구성종목 <span class="small">(${t.rows.length}/${t.total}종목, 기준 ${esc(t.session_date||"-")})</span></h1>`;
  html += `<div class="chips"><span class="chip">상승 ${up}</span><span class="chip">하락 ${down}</span><span class="chip">보합 ${t.rows.length-up-down}</span><span class="chip">출처: ${esc(t.source)}</span></div>`;
  if(t.note) html += `<div class="banner warn">${esc(t.note)}</div>`;
  if(t.error) html += `<div class="banner err">${esc(t.error)}</div>`;
  html += `<div class="grid" style="margin-top:12px"><div class="card"><div class="name">상승 상위 5</div>${byChg.slice(0,5).map(r=>`<div><b>${esc(r.name)}</b> <span class="up">${pct(r.change_pct)}</span></div>`).join("")}</div><div class="card"><div class="name">하락 상위 5</div>${byChg.slice(-5).reverse().map(r=>`<div><b>${esc(r.name)}</b> <span class="down">${pct(r.change_pct)}</span></div>`).join("")}</div></div>`;
  html += `<div class="subtabs">` + SORTS.map(([k,l]) => `<button data-sort="${k}" class="${sort===k?"active":""}">${l} 내림차순</button>`).join("") + `</div>`;
  html += `<div class="tablewrap"><table><thead><tr><th>#</th><th class="l">종목</th><th class="l">티커</th><th class="l">섹터</th><th>종가(${cur})</th><th>등락률</th><th>거래량</th><th>거래대금${t.rows[0]&&t.rows[0].value_estimated?"(추정)":""}</th><th>시가총액</th></tr></thead><tbody>` +
    rows.map((r,i) => `<tr><td>${i+1}</td><td class="l">${esc(r.name)}</td><td class="l mono">${esc(r.ticker)}</td><td class="l small">${esc(r.sector||"-")}</td><td>${fmtPx(r.close)}</td><td class="${cls(r.change_pct)}">${pct(r.change_pct)}</td><td>${fmtNum(r.volume,0)}</td><td>${fmtNum(r.value,0)}</td><td>${fmtNum(r.market_cap,0)}</td></tr>`).join("") + `</tbody></table></div>`;
  return html;
}

// ---- 보고서
function para(s){ return `<p>${esc(s)}</p>`; }
function leadersHtml(ls){ return (ls||[]).length ? `<div class="leaders">${ls.map(l => `<div class="leader"><b>${esc(l.name)}${l.ticker?` <span class="mono small">${esc(l.ticker)}</span>`:""}</b>${esc(l.comment)}</div>`).join("")}</div>` : ""; }
function sectionHtml(s){ return `<section><h3>${esc(s.heading)}</h3>${para(s.body)}${(s.bullets||[]).length?`<ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`:""}</section>`; }
function renderReport(){
  const t = S.key; const name = (TOPICS.find(x => x[0]===t)||[])[1] || t;
  const r = S.reports[t];
  if(r === undefined){ loadReport(t).then(render); return `<div class="empty">불러오는 중…</div>`; }
  if(!r) return `<h1>${esc(name)}</h1><div class="empty">${S.home ? "이 보고서는 생성되지 않았습니다." : "데이터가 없습니다."}</div>`;
  let html = `<h1>${esc(name)} <span class="small">— ${esc(S.date)} 기준${r.generated_at_kst?` · 생성 ${String(r.generated_at_kst).slice(11,16)}`:""}</span></h1>`;
  if(!r.ok) return html + `<div class="banner err">생성 실패: ${esc(r.error||"")}${S.local ? " — 상단 [이 탭 재생성]으로 다시 시도할 수 있습니다." : ""}</div>`;
  if((r.warnings||[]).length) html += `<div class="banner warn">경고: ${esc(r.warnings.join(", "))} (분량 미달 등)</div>`;
  if(r.degraded_selection) html += `<div class="banner warn">기사 태깅 실패로 최신순·키워드 기준으로 선별된 기사입니다.</div>`;
  const rep = r.report;
  html += `<div class="report"><h2 style="margin-top:0;border:0">${esc(rep.title)}</h2><div class="overview">${esc(rep.overview)}</div>`;
  if(t === "sectors"){
    html += `<h2>섹터별 이슈</h2>` + (rep.sectors||[]).map(s => `<div class="sector"><div><span class="dir ${s.direction}">${s.direction==="up"?"상승":s.direction==="down"?"하락":"이슈"}</span><b>${esc(s.name)}</b> <span class="small">${(s.markets||[]).map(esc).join(" · ")}</span></div><p style="margin-top:8px"><b>이유</b> ${esc(s.reason)}</p><p><b>주요 뉴스</b> ${esc(s.news)}</p>${s.etf_note?`<p class="small">ETF: ${esc(s.etf_note)}</p>`:""}${leadersHtml(s.leaders)}</div>`).join("");
    html += `<section><h2>AI 섹터 (매일 필수)</h2>${para(rep.ai_sector)}</section>`;
    if((rep.cross_events||[]).length) html += `<h2>여러 섹터에 걸친 이벤트</h2>` + rep.cross_events.map(sectionHtml).join("");
  } else {
    html += (rep.sections||[]).map(sectionHtml).join("");
    if((rep.leaders||[]).length) html += `<section><h3>주도주·대표주</h3>${leadersHtml(rep.leaders)}</section>`;
  }
  if((rep.events_today||[]).length) html += `<section><h3>오늘·이번 주 이벤트</h3><ul>${rep.events_today.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></section>`;
  if((rep.data_caveats||[]).length) html += `<section><h3>데이터 한계</h3><ul class="small">${rep.data_caveats.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></section>`;
  html += `<p class="small" style="margin-top:18px">${esc(rep.disclaimer)}</p></div>`;
  if((r.articles||[]).length) html += `<h2>근거 기사 (${r.articles.length})</h2><ul class="articles">` + r.articles.map(a => `<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a> <span class="src">${esc(a.publisher||a.source)} · ${esc(a.published_at_kst)}</span></li>`).join("") + `</ul>`;
  if((r.thebell||[]).length) html += `<h2>더벨 헤드라인 (${r.thebell.length})</h2><ul class="articles">` + r.thebell.map(a => `<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a> <span class="src">${esc(a.published_at_kst)}</span></li>`).join("") + `</ul>`;
  return html;
}

// ---- 렌더
function render(){
  renderNav(); renderTop();
  $("#banners").innerHTML = banners().map(([k,m]) => `<div class="banner ${k}">${m}</div>`).join("");
  const v = $("#view");
  v.innerHTML = S.view === "index" ? renderIndex() : S.view === "report" ? renderReport() : renderHome();
  v.querySelectorAll("[data-key]").forEach(el => el.onclick = () => go("index", el.dataset.key));
  v.querySelectorAll("[data-topic]").forEach(el => el.onclick = e => { e.preventDefault(); go("report", el.dataset.topic); });
  v.querySelectorAll("[data-sort]").forEach(el => el.onclick = () => { S.sort = el.dataset.sort; render(); });
  v.querySelectorAll("[data-date]").forEach(el => el.onclick = e => { e.preventDefault(); $("#date").value = el.dataset.date; $("#date").dispatchEvent(new Event("change")); });
}

// ---- 이벤트
$("#date").addEventListener("change", async e => { S.date = e.target.value; await loadDate(); go("home"); render(); });
$("#btnUpdate").onclick = async () => {
  if(!confirm(`${S.date} 기준 업데이트를 시작합니다. 12~20분 걸리며 하루 1회만 가능합니다. 계속할까요?`)) return;
  try { await post("/api/update", {date: S.date}); S._wasRunning = true; pollStatus(); } catch(err){ alert("업데이트 실패: " + err.message); }
};
$("#btnRegen").onclick = async () => {
  const t = S.key; if(!t) return;
  if(!confirm(`${(TOPICS.find(x=>x[0]===t)||[])[1]} 보고서를 다시 생성합니다 (3~8분). 계속할까요?`)) return;
  try { await post("/api/regenerate", {date: S.date, topic: t}); S._wasRunning = true; delete S.reports[t]; pollStatus(); } catch(err){ alert("재생성 실패: " + err.message); }
};
$("#btnPublish").onclick = async () => {
  if(!confirm("docs/ 를 커밋하고 GitHub에 push 합니다. 계속할까요?")) return;
  $("#btnPublish").disabled = true;
  try { const r = await post("/api/publish"); alert((r.ok ? "게시 완료\n" : "게시 실패\n") + (r.output||"")); } catch(err){ alert("게시 실패: " + err.message); } finally { $("#btnPublish").disabled = false; }
};

// ---- 시작
(async () => {
  S.today = kstToday();
  const h = readHash();
  await loadIndex();
  S.date = h.d || S.today;
  $("#date").value = S.date; $("#date").max = S.today;
  await loadDate();
  render();
  pollStatus();
})();
})();
</script>
</body>
</html>
